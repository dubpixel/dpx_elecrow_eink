; ================================================================================
; CONFIG - PlatformIO project config for the ELECROW CrowPanel 5.79" E-Paper
; ================================================================================
; Every pinned value below traces back to a specific, field-reported failure
; mode for this exact board (ESP32-S3-WROOM-1-N8R8, ASIN B0FX4PDW6M) -- see
; firmware/mfg_examples/AMAZON_REVIEW_GOTCHAS.md for the source reviews.
; Do not "helpfully" bump these without re-reading that doc.
; ================================================================================
; PROJECT: dpx_elecrow_eink
; ================================================================================

[env:crowpanel_579]
; Pinned per a detailed Amazon review (ASIN B0FX4PDW6M): Arduino core 3.x
; breaks the WebServer/BLE APIs the Elecrow vendor examples (and this
; template's WiFi-based examples, if you add them) depend on. Stay on 2.x.
platform = espressif32@6.3.2
board = esp32-s3-devkitc-1
framework = arduino

; ESP32-S3-WROOM-1-N8R8 = 8MB flash + 8MB *octal* PSRAM. qio_opi is required
; for the octal PSRAM to be usable -- the default board profile assumes
; quad PSRAM and silently leaves most of the 8MB unavailable.
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
board_upload.flash_size = 8MB
; huge_app.csv: Arduino sketches on the S3 partition table default (with
; OTA) don't leave enough app space for WiFi + JSON + a font-heavy graphics
; stack together. No OTA needed for a display like this.
board_build.partitions = huge_app.csv

monitor_speed = 115200
monitor_filters = esp32_exception_decoder

build_flags =
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue

lib_deps =

; NOTE: the build banner from this toolchain often prints "No PSRAM" during
; compile-time board detection -- that's a known false negative for this
; config, not a real failure. Confirm at runtime with psramFound() /
; ESP.getPsramSize() instead of trusting the banner.
